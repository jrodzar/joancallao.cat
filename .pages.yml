# Configuració del panell d'edició Pages CMS (https://app.pagescms.org)

media:
  input: fotos
  output: fotos
  categories: [image]
  rename: random

content:
  - name: fotos
    label: Fotos
    description: Les fotos del web, en l'ordre en què surten.
    type: file
    path: dades/fotos.json
    format: json
    list: true
    fields:
      - name: foto
        label: Foto
        type: image
        required: true
      - name: titol
        label: Títol
        description: Opcional. Surt a sota de la foto quan s'obre en gran.
        type: string
        required: false
      - name: tema
        label: Tema
        description: Tria'n un de la llista. Per crear-ne de nous, ves a l'apartat Temes.
        type: reference
        options:
          collection: temes
          value: "{nom}"
          label: "{nom}"
          search: nom

  - name: temes
    label: Temes
    description: Els botons de filtre del web. Si n'esborres un, el botó desapareix.
    type: collection
    path: dades/temes
    format: json
    filename: "{nom}.json"
    exclude: [.gitkeep]
    view:
      primary: nom
      fields: [nom]
      sort: [nom]
    fields:
      - name: nom
        label: Nom del tema
        type: string
        required: true

  - name: textos
    label: Textos
    type: file
    path: dades/textos.json
    format: json
    fields:
      - name: titol_portada
        label: Títol de la portada
        description: El text gran de dalt de tot. Pots fer salts de línia.
        type: text
      - name: sobre_mi
        label: Sobre mi
        type: text
      - name: instagram
        label: Usuari d'Instagram
        description: Només el nom, sense @. Si el deixes buit, l'enllaç no surt al web.
        type: string
